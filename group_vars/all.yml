---
# Package inventory for local Ubuntu bootstrap.
# Review before first run. Toggle optional blocks with the flags below.

# --- toggles ---
install_claude_desktop: true
install_google_chrome: true
install_ollama: false
install_flatpak: false
# Lab/scientific extras (NFS, PostScript viewer, terminals, etc.)
enable_lab_packages: true
# Full LMTO stack: apt deps, Intel oneAPI (if installers present), env, build
install_lmto: true

# --- apt: baseline desktop/dev tools ---
apt_packages_common:
  - apt-file
  - apt-transport-https
  - curl
  - gedit
  - gh
  - git
  - make
  - mc
  - python3-pip
  - software-properties-common
  - wget

# --- apt: lab / scientific extras ---
apt_packages_lab:
  - emacs
  - gv
  - kitty
  - nfs-common
  - ntfs-3g
  - openssh-server
  - texinfo
  - tilix
  - traceroute

# --- apt: LMTO build/runtime prerequisites ---
# (subset overlaps lab/common; safe to install again — apt is idempotent)
apt_packages_lmto:
  - build-essential
  - curl
  - gfortran
  - git
  - gv
  - libx11-6
  - libxext6
  - make
  - nfs-common
  - texinfo
  - wget

# --- snaps ---
# VS Code via snap (classic confinement)
snaps:
  - name: code
    classic: true
  - name: telegram-desktop
  - name: claude-code

# --- flatpak (disabled via install_flatpak for now) ---
flatpak_remote_name: flathub
flatpak_remote_url: https://flathub.org/repo/flathub.flatpakrepo

flatpaks:
  - io.github.qwersyk.Newelle
  - com.github.tchx84.Flatseal

# --- local .deb installers ---
# Drop versioned downloads into files/; globs match without renaming.
# If several match, the newest by mtime is installed. *.deb is gitignored.
debs:
  - name: veracrypt
    pattern: veracrypt*.deb
  - name: cursor
    pattern: cursor*.deb

# --- Claude Desktop (custom apt repo) ---
claude_desktop_key_url: https://downloads.claude.ai/claude-desktop/key.asc
claude_desktop_keyring: /usr/share/keyrings/claude-desktop-archive-keyring.asc
claude_desktop_list: /etc/apt/sources.list.d/claude-desktop.list
claude_desktop_repo: >-
  deb [arch=amd64,arm64 signed-by=/usr/share/keyrings/claude-desktop-archive-keyring.asc]
  https://downloads.claude.ai/claude-desktop/apt/stable stable main

# --- Google Chrome ---
chrome_key_url: https://dl.google.com/linux/linux_signing_key.pub
chrome_keyring: /usr/share/keyrings/google-chrome.gpg
chrome_list: /etc/apt/sources.list.d/google-chrome.list
chrome_repo: >-
  deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg]
  https://dl.google.com/linux/chrome/deb/ stable main

# --- Ollama (official linux amd64 tarball into /usr) ---
ollama_tarball_url: https://ollama.com/download/ollama-linux-amd64.tar.zst

# =============================================================================
# LMTO (separate step — tag: lmto)
# Reference: ~/Downloads/lmto-machine-reference.txt (working workstation dump)
# =============================================================================

# Source tree must already exist (copy/rsync/symlink from the other machine).
# Expected layout matches working box: ~/src with configure, MAK/, LMTO/, …
# Prefer login user home when playbook is run via sudo --preserve-env=HOME
bootstrap_home: "{{ ansible_facts['env']['HOME'] | default(lookup('env', 'HOME'), true) }}"
bootstrap_user: "{{ lookup('env', 'SUDO_USER') | default(ansible_facts['user_id'], true) }}"
lmto_src_dir: "{{ bootstrap_home }}/src"

# LSYSTEM selects ~/bin/$LSYSTEM and ~/lib/$LSYSTEM (see Readme.1st)
lmto_lsystem: Linux

# Working machine: SYSMAK=.../MAK/ifx_mkl.mak
lmto_makefile_intel: ifx_mkl.mak
lmto_makefile_gfortran: gfortran.mak

# Match localoptions FFLAGS (... -xHost) from working machine
lmto_enable_xhost: true

# Intel oneAPI offline installers in files/ (gitignored *.sh)
# Working machine had 2025.1 ifx; offline .sh must be re-downloaded if missing
#   intel-fortran-compiler-2025.1.*.offline.sh
#   intel-onemkl-2025.1.*.offline.sh
lmto_install_intel: true
lmto_intel_fortran_pattern: "*fortran*offline.sh"
lmto_intel_mkl_pattern: "*onemkl*offline.sh"
lmto_intel_setvars: /opt/intel/oneapi/setvars.sh
lmto_intel_silent_args: "-a --silent --eula accept"

# World-writable build scratch (as used in prior workstation setup)
lmto_scratch_dir: /scratch
lmto_scratch_mode: "0777"

# Optional institute NFS — working fstab used defaults,soft,vers=4.2,_netdev
lmto_nfs_enable: false
lmto_nfs_source: "pam254:/dep24"
lmto_nfs_path: /dep24
lmto_nfs_opts: "defaults,soft,vers=4.2,_netdev"
lmto_nfs_fstab: true

# Convenience symlinks into the home directory (created only if targets exist)
lmto_home_symlinks:
  - src: /dep24
    dest: "{{ bootstrap_home }}/dep24"
  - src: /dep24/dmazur/R
    dest: "{{ bootstrap_home }}/R_dep24"
  - src: /dep24/dmazur/TeX
    dest: "{{ bootstrap_home }}/TeX_dep24"

# Shell environment: profile.d + ensure ~/.profile sources setvars (as on working box)
lmto_profile_script: /etc/profile.d/lmto.sh
lmto_ensure_user_profile_setvars: true

# Run ./configure + make (set false to only prepare deps/env)
lmto_build: true
