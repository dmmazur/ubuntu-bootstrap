---
# Package inventory for local Ubuntu bootstrap.
# Review before first run. Toggle optional blocks with the flags below.

# --- toggles ---
install_claude_desktop: true
install_google_chrome: true
install_dotnet_sdk: true
install_ollama: false
install_flatpak: false
# Snaps (VS Code, Telegram, …). On WSL, skipped unless install_snaps_on_wsl: true
# (snapd is unreliable under WSL2 and failures used to abort the whole playbook).
install_snaps: true
install_snaps_on_wsl: false
# Cursor/VeraCrypt .debs from files/ (off while testing other sections)
install_debs: false
# Optional/experimental apt extras (terminals, …) — last section, off by default
install_experimental: false
# Lab/scientific extras (NFS, PostScript viewer, etc.)
enable_lab_packages: true
# On WSL, openssh-server postinst often breaks dpkg (no real systemd for ssh).
# Drop it from the lab set when bootstrap_is_wsl is true (set by bootstrap scripts).
apt_packages_lab_skip_on_wsl:
  - openssh-server
# Prefer IPv4 for apt (WSL often has broken IPv6 to Ubuntu mirrors)
bootstrap_force_ipv4: true
# Skip adding Intel oneAPI apt repo when DNS for apt.repos.intel.com is sinkholed
lmto_intel_skip_if_unreachable: true
# LaTeX / TeX Live via apt (dep24 curated set) — self-contained section
install_latex: true
# LaTeX Workshop extension for Cursor + VS Code (separate from TeX Live install)
install_latex_editors: true
# Full LMTO stack (phased: intel / unpack / build / xscr — see files/LMTO.md)
install_lmto: true

# Detected by ./scripts/bootstrap/*.sh and passed as -e (0/1). Defaults for manual ansible.
bootstrap_is_wsl: false
bootstrap_intel_dns_bad: false

# Command logs: scripts/bootstrap/lib.sh sets BOOTSTRAP_LOG_DIR (mktemp under /tmp).
# Symlink: /tmp/ubuntu-bootstrap-latest → latest run. Per-command files: make.log, apt-*.log, …
bootstrap_log_dir: "{{ lookup('env', 'BOOTSTRAP_LOG_DIR') | default('/tmp/ubuntu-bootstrap-manual', true) }}"

# Shared home/user (sudo --preserve-env=HOME). Used by LaTeX, LMTO, and other roles.
bootstrap_home: "{{ ansible_facts['env']['HOME'] | default(lookup('env', 'HOME'), true) }}"
bootstrap_user: >-
  {{ ansible_facts['env']['SUDO_USER']
     | default(lookup('env', 'SUDO_USER'), true)
     | default(bootstrap_home | basename, true) }}
bootstrap_group: "{{ bootstrap_user }}"

# --- apt: baseline desktop/dev tools ---
apt_packages_common:
  - apt-file
  - apt-transport-https
  - curl
  - gedit
  - gh
  - git
  - make
  - mc
  - python3-pip
  - software-properties-common
  - wget

# --- apt: lab / scientific extras ---
apt_packages_lab:
  - emacs
  - gv
  - nfs-common
  - ntfs-3g
  - openssh-server
  - texinfo
  - traceroute

# --- apt: experimental (off by default; last playbook section) ---
apt_packages_experimental:
  - kitty
  - tilix

# --- apt: LaTeX (dep24 manual packages + latexmk/biber; self-contained) ---
# Matches ~/Downloads/dep24/latex-setup-report-*.txt apt-mark list.
# latexmk + biber were missing on dep24 but are small and useful.
apt_packages_latex:
  - texlive-latex-base
  - texlive-latex-recommended
  - texlive-latex-extra
  - texlive-fonts-extra
  - texlive-font-utils
  - texlive-extra-utils
  - texlive-bibtex-extra
  - texlive-publishers
  - texlive-science
  - texlive-lang-cyrillic
  - texinfo
  - latexmk
  - biber

# LaTeX phase toggles (tags: latex-apt | latex-texmf | latex-smoke)
latex_install_apt: true
latex_ensure_texmf: true
latex_texmf_dir: "{{ bootstrap_home }}/texmf"
latex_userdata_archive: "{{ playbook_dir }}/files/latex-userdata.tgz"
latex_run_smoke: true
latex_smoke_dir: "{{ bootstrap_home }}/TeX/smoke"

# --- LaTeX editors: LaTeX Workshop for VS Code (code) and Cursor ---
# Self-contained: skips an editor if its CLI is not installed (does not require snaps/debs/latex).
latex_workshop_extension_id: James-Yu.latex-workshop
latex_editors:
  - name: code
    label: VS Code
  - name: cursor
    label: Cursor

# --- apt: LMTO build/runtime prerequisites ---
# (subset overlaps lab/common; safe to install again — apt is idempotent)
apt_packages_lmto:
  - build-essential
  - curl
  - gfortran
  - git
  - gv
  - libx11-6
  - libxext6
  - make
  - nfs-common
  - texinfo
  - wget

# --- snaps ---
# VS Code via snap (classic confinement)
snaps:
  - name: code
    classic: true
  - name: telegram-desktop
  - name: claude-code

# --- flatpak (disabled via install_flatpak for now) ---
flatpak_remote_name: flathub
flatpak_remote_url: https://flathub.org/repo/flathub.flatpakrepo

flatpaks:
  - io.github.qwersyk.Newelle
  - com.github.tchx84.Flatseal

# --- local .deb installers ---
# Drop versioned downloads into files/; globs match without renaming.
# If several match, the newest by mtime is installed. *.deb is gitignored.
debs:
  - name: veracrypt
    pattern: veracrypt*.deb
  - name: cursor
    pattern: cursor*.deb

# --- Claude Desktop (custom apt repo) ---
claude_desktop_key_url: https://downloads.claude.ai/claude-desktop/key.asc
claude_desktop_keyring: /usr/share/keyrings/claude-desktop-archive-keyring.asc
claude_desktop_list: /etc/apt/sources.list.d/claude-desktop.list
claude_desktop_repo: >-
  deb [arch=amd64,arm64 signed-by=/usr/share/keyrings/claude-desktop-archive-keyring.asc]
  https://downloads.claude.ai/claude-desktop/apt/stable stable main

# --- Google Chrome ---
chrome_key_url: https://dl.google.com/linux/linux_signing_key.pub
chrome_keyring: /usr/share/keyrings/google-chrome.gpg
chrome_list: /etc/apt/sources.list.d/google-chrome.list
chrome_repo: >-
  deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg]
  https://dl.google.com/linux/chrome/deb/ stable main

# --- .NET SDK (package name pins major version) ---
# Ubuntu 22.04 / 24.04: dotnet-sdk-8.0 is in the built-in apt feed.
# Ubuntu 26.04+: .NET 8 is only in ppa:dotnet/backports (built-in has .NET 10).
# Snap `dotnet` / `dotnet-sdk --classic` is a different path; we stay on apt.
# https://learn.microsoft.com/en-us/dotnet/core/install/linux-ubuntu-install
# https://devblogs.microsoft.com/dotnet/whats-new-for-dotnet-in-ubuntu-2604/
dotnet_sdk_version: "8.0"
dotnet_sdk_package: dotnet-sdk-8.0
dotnet_backports_ppa: "ppa:dotnet/backports"
# Add backports when Ubuntu version is >= this (needed for .NET 8 on 26.04+)
dotnet_backports_min_ubuntu: "26.04"

# --- Ollama (official linux amd64 tarball into /usr) ---
ollama_tarball_url: https://ollama.com/download/ollama-linux-amd64.tar.zst

# =============================================================================
# LMTO — phases (tags): lmto-intel | lmto-unpack | lmto-rdir | lmto-build | lmto-xscr | lmto-test
# Full stack: tag lmto   Reference: AIR install (LSYSTEM=ifx)
# =============================================================================

lmto_src_dir: "{{ bootstrap_home }}/src"

# Phase toggles (also runnable separately via tags / bootstrap-lmto.sh <phase>)
lmto_install_intel: true
lmto_unpack_archives: true
lmto_build: true
lmto_install_xscr: true
lmto_create_r_dir: true
lmto_run_fe_test: true

# Case/work directory used by lmt (path must contain /R/ for scratch naming)
lmto_r_dir: "{{ bootstrap_home }}/R"

# Fe smoke test (tag lmto-test) — answers for startlmt.f inif() prompts.
# Wipes ~/R/Fe each run; bare `lmt` writes default lmt.lmt
# (wrapper only uses Fe.lmt if that file already exists).
lmto_test_case_dir: "{{ lmto_r_dir }}/Fe"
lmto_test_ini: lmt.lmt
lmto_test_compound: Fe
lmto_test_space_group: "229"
lmto_test_alat: "-2.86"
lmto_test_nsort: "1"
lmto_test_taux: "0 0 0"
lmto_test_element: Fe
lmto_test_empty_spheres: "y"
lmto_test_es_grid: ""
lmto_test_es_smt: ""

# LSYSTEM selects ~/bin/$LSYSTEM and ~/lib/$LSYSTEM (AIR: ifx, not uname/Linux)
lmto_lsystem: ifx

# Makefile after unpacking patch (MAK/ifx_mkl.mak comes from lmto*.p.tar.gz)
lmto_makefile_intel: ifx_mkl.mak
lmto_makefile_gfortran: gfortran.mak

# Extra FFLAGS appended in OBJ/$LSYSTEM/localoptions (AIR: -xHost -debug all -g -traceback)
lmto_fflags_extra: "-xHost -debug all -g -traceback"

# Drop from configure TARGETS / makefile all: (AIR omitted these; Xscr is phase lmto-xscr).
# GRFTOOLS old C fails on modern gcc (implicit-function-declaration).
lmto_exclude_targets:
  - GRFTOOLS
  - XSCR

# --- Phase 1: Intel oneAPI apt ---
lmto_install_intel_fortran_apt: true
lmto_install_intel_mkl_apt: true
lmto_intel_fortran_package: intel-oneapi-compiler-fortran
# AIR used runtime intel-oneapi-mkl (sufficient with -qmkl + setvars)
lmto_intel_mkl_package: intel-oneapi-mkl

intel_oneapi_key_url: https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB
intel_oneapi_keyring: /usr/share/keyrings/oneapi-archive-keyring.gpg
intel_oneapi_list: /etc/apt/sources.list.d/oneAPI.list
intel_oneapi_repo: >-
  deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg]
  https://apt.repos.intel.com/oneapi all main

lmto_intel_setvars: /opt/intel/oneapi/setvars.sh

# Shell env (AIR: setvars only in ~/.bashrc — not in profile.d)
lmto_profile_script: /etc/profile.d/lmto.sh   # PATH + LSYSTEM only
lmto_ensure_bashrc_lsystem: true
lmto_ensure_bashrc_setvars: true
# Optional legacy: also source setvars from ~/.profile (AIR did not; avoid duplicate)
lmto_ensure_user_profile_setvars: false

# --- Phase 2: create ~/src + unpack archives ---
# Drop archives in files/ and/or already in ~/src. Copied from files/ first if present.
lmto_archive_base: lmto5.04.6.tar.gz
lmto_archive_patch: lmto5.04.6p.tar.gz
lmto_archive_src_dirs:
  - "{{ playbook_dir }}/files"
  - "{{ bootstrap_home }}/Downloads"
  - "{{ bootstrap_home }}/src"

# --- Phase 3: configure + make ---
lmto_scratch_enable: false
lmto_scratch_dir: /scratch
lmto_scratch_mode: "0777"
# LMTO makefiles are not parallel-safe (races on sysbat / makefile.run). Keep 1.
lmto_make_jobs: 1

# Optional institute NFS (AIR: off)
lmto_nfs_enable: false
lmto_nfs_source: "pam254:/dep24"
lmto_nfs_path: /dep24
lmto_nfs_opts: "defaults,soft,vers=4.2,_netdev"
lmto_nfs_fstab: true

lmto_home_symlinks:
  - src: /dep24
    dest: "{{ bootstrap_home }}/dep24"
  - src: /dep24/dmazur/R
    dest: "{{ bootstrap_home }}/R_dep24"
  - src: /dep24/dmazur/TeX
    dest: "{{ bootstrap_home }}/TeX_dep24"

# --- Phase 4: Xscr + graphics helpers ---
# Copy prebuilt SCRIPT binaries → ~/bin/<name> and symlink ~/bin/$LSYSTEM/<name>.
# Search order: SCRIPT/ (from unpack), then playbook files/ (drop-in prebuilts).
# GRFTOOLS/XSCR are excluded from make; ship grf2eps/grfonts like Xscr.
lmto_xscr_binaries:
  - Xscr
  - grf2eps
  - grfonts
lmto_xscr_src_dirs:
  - "{{ lmto_src_dir }}/SCRIPT"
  - "{{ playbook_dir }}/files"
# Backward-compat alias (unused by tasks; kept for older docs/overrides)
lmto_xscr_src: "{{ lmto_src_dir }}/SCRIPT/Xscr"
