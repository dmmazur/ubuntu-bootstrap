[defaults]
inventory = inventory.ini
roles_path = roles
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent
# Local become/sudo can exceed the default 10s when prompting
timeout = 60
# Clearer play output (use -v / -vv for more detail)
stdout_callback = default
callback_result_format = yaml
# Colors when stdout is piped through tee (bootstrap scripts log to /tmp)
force_color = True
show_task_path_on_failure = true
display_skipped_hosts = true
display_ok_hosts = true
# Future-proof ansible-core 2.24+ (use ansible_facts[...] explicitly)
inject_facts_as_vars = False
deprecation_warnings = True

[privilege_escalation]
become = True
become_method = sudo
become_user = root
