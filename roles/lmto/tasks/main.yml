---
# LMTO phases (run separately via tags or bootstrap-lmto.sh <phase>):
#   lmto-intel  — Intel apt repo + ifx/MKL + bashrc/profile.d
#   lmto-unpack — ~/src + unpack base then patch archives
#   lmto-build  — apt deps, configure, localoptions, make
#   lmto-xscr   — copy SCRIPT/Xscr → ~/bin + ~/bin/$LSYSTEM
# Full: --tags lmto

- name: ">>> LMTO role — phases intel / unpack / build / xscr"
  ansible.builtin.debug:
    msg:
      src: "{{ lmto_src_dir }}"
      lsystem: "{{ lmto_lsystem }}"
      intel: "{{ lmto_install_intel }}"
      unpack: "{{ lmto_unpack_archives }}"
      build: "{{ lmto_build }}"
      xscr: "{{ lmto_install_xscr }}"
  tags: [lmto, lmto-intel, lmto-unpack, lmto-build, lmto-xscr]

- name: Include Intel oneAPI phase
  ansible.builtin.include_tasks:
    file: intel.yml
    apply:
      tags: [lmto, lmto-intel]
  when: lmto_install_intel | bool
  tags: [lmto, lmto-intel]

- name: Include unpack archives phase
  ansible.builtin.include_tasks:
    file: unpack.yml
    apply:
      tags: [lmto, lmto-unpack]
  when: lmto_unpack_archives | bool
  tags: [lmto, lmto-unpack]

- name: Include configure/make phase
  ansible.builtin.include_tasks:
    file: build.yml
    apply:
      tags: [lmto, lmto-build]
  when: lmto_build | bool
  tags: [lmto, lmto-build]

- name: Include Xscr phase
  ansible.builtin.include_tasks:
    file: xscr.yml
    apply:
      tags: [lmto, lmto-xscr]
  when: lmto_install_xscr | bool
  tags: [lmto, lmto-xscr]

- name: Include optional NFS (when enabled)
  ansible.builtin.include_tasks:
    file: nfs.yml
    apply:
      tags: [lmto]
  when: lmto_nfs_enable | bool
  tags: [lmto]
