---
# Phase 4: install prebuilt SCRIPT binaries (AIR: Xscr + grf2eps + grfonts)
# Tag: lmto-xscr
#
# Copies each name from SCRIPT/ (or files/) → ~/bin/<name>, then symlinks
# into SYSBIN (~/bin/$LSYSTEM/). GRFTOOLS/XSCR are excluded from make.

- name: ">>> XSCR — install prebuilt SCRIPT binaries"
  ansible.builtin.debug:
    msg:
      binaries: "{{ lmto_xscr_binaries }}"
      src_dirs: "{{ lmto_xscr_src_dirs }}"
      scripts_bin: "{{ bootstrap_home }}/bin"
      sysbin: "{{ bootstrap_home }}/bin/{{ lmto_lsystem }}"

- name: Install Xscr / grf2eps / grfonts
  block:
    - name: Ensure ~/bin and ~/bin/{{ lmto_lsystem }} exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ bootstrap_user }}"
        group: "{{ bootstrap_group }}"
        mode: "0755"
      loop:
        - "{{ bootstrap_home }}/bin"
        - "{{ bootstrap_home }}/bin/{{ lmto_lsystem }}"

    - name: Install each SCRIPT binary
      ansible.builtin.include_tasks: xscr_one.yml
      loop: "{{ lmto_xscr_binaries }}"
      loop_control:
        loop_var: lmto_xscr_name

  always:
    - name: Reclaim ownership after Xscr
      ansible.builtin.include_tasks: ownership.yml
