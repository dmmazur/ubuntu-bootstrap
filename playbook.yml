---
# Local Ubuntu workstation bootstrap.
# Tags: common, snaps, flatpak, debs, claude, chrome, dotnet, ollama, lab, latex, latex-editors, lmto
# Tip: add -v or -vv for more Ansible detail.
# Command logs: {{ bootstrap_log_dir }} (see scripts/bootstrap/lib.sh / /tmp/ubuntu-bootstrap-latest)

- name: Bootstrap local Ubuntu
  hosts: local
  become: true
  gather_facts: true

  tasks:
    - name: Ensure bootstrap command log directory exists
      ansible.builtin.file:
        path: "{{ bootstrap_log_dir }}"
        state: directory
        mode: "0755"
      tags: [always]

    - name: Announce bootstrap log directory
      ansible.builtin.debug:
        msg: >-
          Command logs → {{ bootstrap_log_dir }}
          (symlink /tmp/ubuntu-bootstrap-latest when using ./scripts/bootstrap/*.sh)
      tags: [always]

    - name: Detect WSL
      ansible.builtin.shell: |
        grep -qiE 'microsoft|wsl' /proc/version 2>/dev/null \
          || grep -qi microsoft /proc/sys/kernel/osrelease 2>/dev/null \
          || [[ -n "${WSL_DISTRO_NAME:-}" ]]
      args:
        executable: /bin/bash
      register: bootstrap_wsl_probe
      changed_when: false
      failed_when: false
      tags: [always]

    - name: Set bootstrap_is_wsl (CLI -e or probe)
      ansible.builtin.set_fact:
        bootstrap_is_wsl: >-
          {{
            (bootstrap_is_wsl | default(false) | bool)
            or (bootstrap_wsl_probe.rc | default(1) | int == 0)
          }}
      tags: [always]

    - name: Compute effective lab package list (drop openssh-server on WSL)
      ansible.builtin.set_fact:
        apt_packages_lab_effective: >-
          {{
            apt_packages_lab
            | reject('in', apt_packages_lab_skip_on_wsl | default([]))
            | list
            if (bootstrap_is_wsl | default(false) | bool)
            else apt_packages_lab
          }}
      tags: [lab, always]

    - name: Decide whether to install snaps
      ansible.builtin.set_fact:
        bootstrap_do_snaps: >-
          {{
            (install_snaps | default(true) | bool)
            and (
              not (bootstrap_is_wsl | default(false) | bool)
              or (install_snaps_on_wsl | default(false) | bool)
            )
          }}
      tags: [snaps, always]

    - name: Ensure apt ForceIPv4 when enabled
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/99ubuntu-bootstrap-force-ipv4
        mode: "0644"
        content: |
          Acquire::ForceIPv4 "true";
      when: bootstrap_force_ipv4 | default(true) | bool
      tags: [always]

    - name: ">>> COMMON — {{ apt_packages_common | length }} apt package(s)"
      ansible.builtin.debug:
        msg: "{{ apt_packages_common }}"
      tags: [common]

    - name: Update apt cache (logged)
      ansible.builtin.include_tasks: tasks/logged_apt_update.yml
      tags: [common, lab, claude, chrome, dotnet, lmto]

    - name: Install common apt packages (logged)
      ansible.builtin.include_tasks: tasks/logged_apt_install.yml
      vars:
        logged_apt_name: apt-common
        logged_apt_packages: "{{ apt_packages_common }}"
      tags: [common]

    - name: ">>> LAB — {{ apt_packages_lab_effective | default(apt_packages_lab) | length }} apt package(s)"
      ansible.builtin.debug:
        msg:
          packages: "{{ apt_packages_lab_effective | default(apt_packages_lab) }}"
          wsl: "{{ bootstrap_is_wsl | default(false) }}"
      when: enable_lab_packages | bool
      tags: [lab]

    - name: Install lab apt packages (logged)
      ansible.builtin.include_tasks: tasks/logged_apt_install.yml
      vars:
        logged_apt_name: apt-lab
        logged_apt_packages: "{{ apt_packages_lab_effective | default(apt_packages_lab) }}"
      when: enable_lab_packages | bool
      tags: [lab]

    - name: ">>> FLATPAK — {{ flatpaks | length }} app(s)"
      ansible.builtin.debug:
        msg: "{{ flatpaks }}"
      when: install_flatpak | bool
      tags: [flatpak]

    - name: Ensure Flathub remote exists
      community.general.flatpak_remote:
        name: "{{ flatpak_remote_name }}"
        flatpakrepo_url: "{{ flatpak_remote_url }}"
        state: present
      when: install_flatpak | bool
      tags: [flatpak]

    - name: Install Flatpak app
      community.general.flatpak:
        name: "{{ item }}"
        state: present
      loop: "{{ flatpaks }}"
      loop_control:
        label: "{{ item }}"
      when: install_flatpak | bool
      tags: [flatpak]

    - name: ">>> CLAUDE DESKTOP"
      ansible.builtin.debug:
        msg: "Installing Claude Desktop from vendor apt repo"
      when: install_claude_desktop | bool
      tags: [claude]

    - name: Install Claude Desktop apt key
      ansible.builtin.get_url:
        url: "{{ claude_desktop_key_url }}"
        dest: "{{ claude_desktop_keyring }}"
        mode: "0644"
      when: install_claude_desktop | bool
      tags: [claude]

    - name: Add Claude Desktop apt repository
      ansible.builtin.copy:
        dest: "{{ claude_desktop_list }}"
        mode: "0644"
        content: "{{ claude_desktop_repo }}\n"
      when: install_claude_desktop | bool
      tags: [claude]

    - name: Install Claude Desktop (logged)
      ansible.builtin.include_tasks: tasks/logged_apt_install.yml
      vars:
        logged_apt_name: apt-claude-desktop
        logged_apt_packages: [claude-desktop]
        logged_apt_update: true
      when: install_claude_desktop | bool
      tags: [claude]

    - name: ">>> GOOGLE CHROME"
      ansible.builtin.debug:
        msg: "Installing Google Chrome from Google apt repo"
      when: install_google_chrome | bool
      tags: [chrome]

    - name: Install Google Chrome signing key
      ansible.builtin.shell: |
        set -uo pipefail
        mkdir -p "{{ bootstrap_log_dir }}"
        logf="{{ bootstrap_log_dir }}/chrome-keyring.log"
        set +e
        {
          printf '# %s  curl | gpg --dearmor\n' "$(date -Iseconds)"
          curl -fsSL "{{ chrome_key_url }}" | gpg --dearmor -o "{{ chrome_keyring }}"
        } 2>&1 | tee -a "${logf}"
        rc=${PIPESTATUS[0]}
        set -e
        exit "${rc}"
      args:
        creates: "{{ chrome_keyring }}"
        executable: /bin/bash
      when: install_google_chrome | bool
      tags: [chrome]

    - name: Add Google Chrome apt repository
      ansible.builtin.copy:
        dest: "{{ chrome_list }}"
        mode: "0644"
        content: "{{ chrome_repo }}\n"
      when: install_google_chrome | bool
      tags: [chrome]

    - name: Install Google Chrome (logged)
      ansible.builtin.include_tasks: tasks/logged_apt_install.yml
      vars:
        logged_apt_name: apt-google-chrome
        logged_apt_packages: [google-chrome-stable]
        logged_apt_update: true
      when: install_google_chrome | bool
      tags: [chrome]

    - name: ">>> DOTNET — .NET {{ dotnet_sdk_version }} SDK"
      ansible.builtin.debug:
        msg: >-
          Installing {{ dotnet_sdk_package }} via apt
          (Ubuntu {{ ansible_facts['distribution_version'] | default('?') }};
          backports PPA if >= {{ dotnet_backports_min_ubuntu }})
      when: install_dotnet_sdk | bool
      tags: [dotnet]

    - name: Add .NET backports PPA (Ubuntu {{ dotnet_backports_min_ubuntu }}+ needs it for .NET 8)
      ansible.builtin.shell: |
        set -uo pipefail
        mkdir -p "{{ bootstrap_log_dir }}"
        logf="{{ bootstrap_log_dir }}/dotnet-backports-ppa.log"
        set +e
        {
          printf '# %s  add-apt-repository -y %s\n' "$(date -Iseconds)" "{{ dotnet_backports_ppa }}"
          add-apt-repository -y "{{ dotnet_backports_ppa }}"
        } 2>&1 | tee -a "${logf}"
        rc=${PIPESTATUS[0]}
        set -e
        exit "${rc}"
      args:
        executable: /bin/bash
      when:
        - install_dotnet_sdk | bool
        - ansible_facts['distribution'] | default('') == 'Ubuntu'
        - (ansible_facts['distribution_version'] | default('0')) is version(dotnet_backports_min_ubuntu, '>=')
      tags: [dotnet]

    - name: Install .NET SDK (logged)
      ansible.builtin.include_tasks: tasks/logged_apt_install.yml
      vars:
        logged_apt_name: "apt-{{ dotnet_sdk_package }}"
        logged_apt_packages: "{{ [dotnet_sdk_package] }}"
        logged_apt_update: true
      when: install_dotnet_sdk | bool
      tags: [dotnet]

    - name: ">>> OLLAMA"
      ansible.builtin.debug:
        msg: "Installing Ollama from upstream tarball"
      when: install_ollama | bool
      tags: [ollama]

    - name: Ensure ollama system user exists
      ansible.builtin.user:
        name: ollama
        system: true
        shell: /usr/sbin/nologin
        home: /usr/share/ollama
        create_home: true
      when: install_ollama | bool
      tags: [ollama]

    - name: Download and extract Ollama
      ansible.builtin.unarchive:
        src: "{{ ollama_tarball_url }}"
        dest: /usr
        remote_src: true
        extra_opts: [--zstd]
        creates: /usr/bin/ollama
      when: install_ollama | bool
      tags: [ollama]

    - name: Install Ollama systemd unit
      ansible.builtin.copy:
        dest: /etc/systemd/system/ollama.service
        mode: "0644"
        content: |
          [Unit]
          Description=Ollama Service
          After=network-online.target

          [Service]
          ExecStart=/usr/bin/ollama serve
          User=ollama
          Group=ollama
          Restart=always
          RestartSec=3

          [Install]
          WantedBy=default.target
      when: install_ollama | bool
      tags: [ollama]
      notify: Restart ollama

    - name: Enable and start Ollama
      ansible.builtin.systemd:
        name: ollama
        enabled: true
        state: started
        daemon_reload: true
      when: install_ollama | bool
      tags: [ollama]

    - name: ">>> LATEX — TeX Live apt (self-contained)"
      ansible.builtin.debug:
        msg: "LaTeX role: {{ apt_packages_latex | length }} apt package(s), texmf={{ latex_texmf_dir }}"
      when: install_latex | bool
      tags: [latex, latex-apt, latex-texmf, latex-smoke]

    - name: Install and configure LaTeX
      ansible.builtin.include_role:
        name: latex
      when: install_latex | bool
      tags: [latex, latex-apt, latex-texmf, latex-smoke]

    # Snaps late so apt/vendor sections are not blocked by snapd; before IDE
    # extensions so VS Code (`code` snap) exists when LaTeX Workshop installs.
    - name: ">>> SNAPS — skipped on WSL (set install_snaps_on_wsl: true to force)"
      ansible.builtin.debug:
        msg: >-
          Skipping snaps on WSL (install_snaps={{ install_snaps }},
          install_snaps_on_wsl={{ install_snaps_on_wsl }}).
          Prefer Windows VS Code / native apps; see troubleshooting/wsl-snap-install-fails.md
      when:
        - install_snaps | default(true) | bool
        - bootstrap_is_wsl | default(false) | bool
        - not (install_snaps_on_wsl | default(false) | bool)
      tags: [snaps]

    - name: ">>> SNAPS — {{ snaps | length }} package(s)"
      ansible.builtin.debug:
        msg: "{{ snaps | map(attribute='name') | list }}"
      when: bootstrap_do_snaps | default(false) | bool
      tags: [snaps]

    - name: Install snap package
      community.general.snap:
        name: "{{ item.name }}"
        classic: "{{ item.classic | default(false) }}"
        state: present
      loop: "{{ snaps }}"
      loop_control:
        label: "{{ item.name }}"
      when: bootstrap_do_snaps | default(false) | bool
      ignore_errors: true
      register: bootstrap_snap_results
      tags: [snaps]

    - name: Warn about failed snap installs (non-fatal)
      ansible.builtin.debug:
        msg: >-
          Snap {{ item.item.name }} failed (ignored so other sections can continue):
          {{ item.msg | default(item.stderr | default('unknown error')) }}
      loop: "{{ bootstrap_snap_results.results | default([]) }}"
      loop_control:
        label: "{{ item.item.name | default('snap') }}"
      when:
        - bootstrap_do_snaps | default(false) | bool
        - bootstrap_snap_results is defined
        - item.failed | default(false) | bool
      tags: [snaps]

    - name: ">>> LATEX EDITORS — LaTeX Workshop (Cursor / VS Code)"
      ansible.builtin.debug:
        msg: "Extension {{ latex_workshop_extension_id }} for {{ latex_editors | map(attribute='name') | list }}"
      when: install_latex_editors | bool
      tags: [latex-editors]

    - name: Install LaTeX Workshop editor extensions
      ansible.builtin.include_role:
        name: latex_editors
      when: install_latex_editors | bool
      tags: [latex-editors]

    - name: ">>> LMTO — phased install (intel / unpack / build / xscr)"
      ansible.builtin.debug:
        msg: "LMTO role: LSYSTEM={{ lmto_lsystem }}, src={{ lmto_src_dir }}"
      when: install_lmto | bool
      tags: [lmto, lmto-intel, lmto-unpack, lmto-build, lmto-xscr, lmto-ownership, lmto-rdir, lmto-test]

    - name: Install LMTO and prerequisites
      ansible.builtin.include_role:
        name: lmto
      when: install_lmto | bool
      tags: [lmto, lmto-intel, lmto-unpack, lmto-build, lmto-xscr, lmto-ownership, lmto-rdir, lmto-test]

    # Local .debs last (disabled by default). Only enter this section when enabled.
    - name: Install local .deb packages from files/
      when: install_debs | bool
      tags: [debs]
      block:
        - name: ">>> DEBS — patterns {{ debs | map(attribute='pattern') | list }}"
          ansible.builtin.debug:
            msg: "Searching {{ playbook_dir }}/files for matching .deb files"

        - name: Locate .deb packages in files/
          ansible.builtin.find:
            paths: "{{ playbook_dir }}/files"
            patterns: "{{ item.pattern }}"
            file_type: file
          loop: "{{ debs }}"
          register: deb_finds
          loop_control:
            label: "{{ item.name }} ({{ item.pattern }})"

        - name: Install matching .deb (logged)
          ansible.builtin.shell: |
            set -uo pipefail
            mkdir -p "{{ bootstrap_log_dir }}"
            deb="{{ (item.files | sort(attribute='mtime') | last).path }}"
            logf="{{ bootstrap_log_dir }}/apt-deb-{{ item.item.name }}.log"
            set +e
            {
              printf '# %s  apt-get install -y %s\n' "$(date -Iseconds)" "${deb}"
              DEBIAN_FRONTEND=noninteractive apt-get install -y "${deb}"
            } 2>&1 | tee -a "${logf}"
            rc=${PIPESTATUS[0]}
            set -e
            exit "${rc}"
          args:
            executable: /bin/bash
          loop: "{{ deb_finds.results | selectattr('files', 'defined') | rejectattr('files', 'equalto', []) | list }}"
          loop_control:
            label: "{{ item.item.name }} -> {{ (item.files | sort(attribute='mtime') | last).path | basename }}"

        - name: Warn when no matching .deb found
          ansible.builtin.debug:
            msg: "Skipping {{ item.item.name }} — no file matching files/{{ item.item.pattern }}"
          loop: "{{ deb_finds.results | selectattr('files', 'defined') | selectattr('files', 'equalto', []) | list }}"
          loop_control:
            label: "{{ item.item.name }}"

  handlers:
    - name: Restart ollama
      ansible.builtin.systemd:
        name: ollama
        state: restarted
        daemon_reload: true
