---
# Local Ubuntu workstation bootstrap.
# Tags: common, snaps, flatpak, debs, claude, chrome, ollama, lab, lmto
# Tip: add -v or -vv for more Ansible detail.

- name: Bootstrap local Ubuntu
  hosts: local
  become: true
  gather_facts: true

  tasks:
    - name: ">>> COMMON — {{ apt_packages_common | length }} apt package(s)"
      ansible.builtin.debug:
        msg: "{{ apt_packages_common }}"
      tags: [common]

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      tags: [common, lab, claude, chrome, lmto]

    - name: Install common apt package
      ansible.builtin.apt:
        name: "{{ item }}"
        state: present
      loop: "{{ apt_packages_common }}"
      loop_control:
        label: "{{ item }}"
      tags: [common]

    - name: ">>> LAB — {{ apt_packages_lab | length }} apt package(s)"
      ansible.builtin.debug:
        msg: "{{ apt_packages_lab }}"
      when: enable_lab_packages | bool
      tags: [lab]

    - name: Install lab apt package
      ansible.builtin.apt:
        name: "{{ item }}"
        state: present
      loop: "{{ apt_packages_lab }}"
      loop_control:
        label: "{{ item }}"
      when: enable_lab_packages | bool
      tags: [lab]

    - name: ">>> FLATPAK — {{ flatpaks | length }} app(s)"
      ansible.builtin.debug:
        msg: "{{ flatpaks }}"
      when: install_flatpak | bool
      tags: [flatpak]

    - name: Ensure Flathub remote exists
      community.general.flatpak_remote:
        name: "{{ flatpak_remote_name }}"
        flatpakrepo_url: "{{ flatpak_remote_url }}"
        state: present
      when: install_flatpak | bool
      tags: [flatpak]

    - name: Install Flatpak app
      community.general.flatpak:
        name: "{{ item }}"
        state: present
      loop: "{{ flatpaks }}"
      loop_control:
        label: "{{ item }}"
      when: install_flatpak | bool
      tags: [flatpak]

    - name: ">>> SNAPS — {{ snaps | length }} package(s)"
      ansible.builtin.debug:
        msg: "{{ snaps | map(attribute='name') | list }}"
      tags: [snaps]

    - name: Install snap package
      community.general.snap:
        name: "{{ item.name }}"
        classic: "{{ item.classic | default(false) }}"
        state: present
      loop: "{{ snaps }}"
      loop_control:
        label: "{{ item.name }}"
      tags: [snaps]

    - name: ">>> CLAUDE DESKTOP"
      ansible.builtin.debug:
        msg: "Installing Claude Desktop from vendor apt repo"
      when: install_claude_desktop | bool
      tags: [claude]

    - name: Install Claude Desktop apt key
      ansible.builtin.get_url:
        url: "{{ claude_desktop_key_url }}"
        dest: "{{ claude_desktop_keyring }}"
        mode: "0644"
      when: install_claude_desktop | bool
      tags: [claude]

    - name: Add Claude Desktop apt repository
      ansible.builtin.copy:
        dest: "{{ claude_desktop_list }}"
        mode: "0644"
        content: "{{ claude_desktop_repo }}\n"
      when: install_claude_desktop | bool
      tags: [claude]

    - name: Install Claude Desktop
      ansible.builtin.apt:
        name: claude-desktop
        state: present
        update_cache: true
      when: install_claude_desktop | bool
      tags: [claude]

    - name: ">>> GOOGLE CHROME"
      ansible.builtin.debug:
        msg: "Installing Google Chrome from Google apt repo"
      when: install_google_chrome | bool
      tags: [chrome]

    - name: Install Google Chrome signing key
      ansible.builtin.shell: |
        set -euo pipefail
        curl -fsSL "{{ chrome_key_url }}" \
          | gpg --dearmor -o "{{ chrome_keyring }}"
      args:
        creates: "{{ chrome_keyring }}"
      when: install_google_chrome | bool
      tags: [chrome]

    - name: Add Google Chrome apt repository
      ansible.builtin.copy:
        dest: "{{ chrome_list }}"
        mode: "0644"
        content: "{{ chrome_repo }}\n"
      when: install_google_chrome | bool
      tags: [chrome]

    - name: Install Google Chrome
      ansible.builtin.apt:
        name: google-chrome-stable
        state: present
        update_cache: true
      when: install_google_chrome | bool
      tags: [chrome]

    - name: ">>> OLLAMA"
      ansible.builtin.debug:
        msg: "Installing Ollama from upstream tarball"
      when: install_ollama | bool
      tags: [ollama]

    - name: Ensure ollama system user exists
      ansible.builtin.user:
        name: ollama
        system: true
        shell: /usr/sbin/nologin
        home: /usr/share/ollama
        create_home: true
      when: install_ollama | bool
      tags: [ollama]

    - name: Download and extract Ollama
      ansible.builtin.unarchive:
        src: "{{ ollama_tarball_url }}"
        dest: /usr
        remote_src: true
        extra_opts: [--zstd]
        creates: /usr/bin/ollama
      when: install_ollama | bool
      tags: [ollama]

    - name: Install Ollama systemd unit
      ansible.builtin.copy:
        dest: /etc/systemd/system/ollama.service
        mode: "0644"
        content: |
          [Unit]
          Description=Ollama Service
          After=network-online.target

          [Service]
          ExecStart=/usr/bin/ollama serve
          User=ollama
          Group=ollama
          Restart=always
          RestartSec=3

          [Install]
          WantedBy=default.target
      when: install_ollama | bool
      tags: [ollama]
      notify: Restart ollama

    - name: Enable and start Ollama
      ansible.builtin.systemd:
        name: ollama
        enabled: true
        state: started
        daemon_reload: true
      when: install_ollama | bool
      tags: [ollama]

    - name: ">>> LMTO — phased install (intel / unpack / build / xscr)"
      ansible.builtin.debug:
        msg: "LMTO role: LSYSTEM={{ lmto_lsystem }}, src={{ lmto_src_dir }}"
      when: install_lmto | bool
      tags: [lmto, lmto-intel, lmto-unpack, lmto-build, lmto-xscr, lmto-ownership, lmto-rdir, lmto-test]

    - name: Install LMTO and prerequisites
      ansible.builtin.include_role:
        name: lmto
      when: install_lmto | bool
      tags: [lmto, lmto-intel, lmto-unpack, lmto-build, lmto-xscr, lmto-ownership, lmto-rdir, lmto-test]

    # Local .debs last (disabled by default). Only enter this section when enabled.
    - name: Install local .deb packages from files/
      when: install_debs | bool
      tags: [debs]
      block:
        - name: ">>> DEBS — patterns {{ debs | map(attribute='pattern') | list }}"
          ansible.builtin.debug:
            msg: "Searching {{ playbook_dir }}/files for matching .deb files"

        - name: Locate .deb packages in files/
          ansible.builtin.find:
            paths: "{{ playbook_dir }}/files"
            patterns: "{{ item.pattern }}"
            file_type: file
          loop: "{{ debs }}"
          register: deb_finds
          loop_control:
            label: "{{ item.name }} ({{ item.pattern }})"

        - name: Install matching .deb
          ansible.builtin.apt:
            deb: "{{ (item.files | sort(attribute='mtime') | last).path }}"
            state: present
          loop: "{{ deb_finds.results | selectattr('files', 'defined') | rejectattr('files', 'equalto', []) | list }}"
          loop_control:
            label: "{{ item.item.name }} -> {{ (item.files | sort(attribute='mtime') | last).path | basename }}"

        - name: Warn when no matching .deb found
          ansible.builtin.debug:
            msg: "Skipping {{ item.item.name }} — no file matching files/{{ item.item.pattern }}"
          loop: "{{ deb_finds.results | selectattr('files', 'defined') | selectattr('files', 'equalto', []) | list }}"
          loop_control:
            label: "{{ item.item.name }}"

  handlers:
    - name: Restart ollama
      ansible.builtin.systemd:
        name: ollama
        state: restarted
        daemon_reload: true
